<!DOCTYPE html>

<html lang="pt-br">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Portal do Aluno - Perfil</title>
        <link rel="stylesheet" href="../css/style.css">
        <link rel="icon" href="https://img.icons8.com/?size=100&id=64144&format=png&color=000000" type="image/png">
        <script src="../javascript/login.js" defer></script>
    </head>

    <body>
        <div class="principal-perfil">
            <h1 class="nome" id="nome"></h1>
            <img id="foto-de-perfil" alt="Foto do Aluno" class="foto">
            <p class="aviso-login" id="aviso"></p>
            <p class="email" id="email">Email: </p>
            <p class="matricula" id="matricula">Matrícula: </p>
            <p class="curso" id="curso">Curso: </p>
            <p class="periodo" id="periodo">Período: </p>
            <p class="cpf" id="cpf">CPF: </p>
            <div class="linha"></div>
            <button class="botao-perfil" id="botao-perfil">Perfil</button>
            <button class="botao-boletim" id="botao-boletim">Boletim</button>
            <button class="botao-disciplinas" id="botao-disciplinas">Disciplinas</button>
            <button class="botao-projetos" id="botao-projetos">Projetos</button>
            <a href="../index.html" class="botao-voltar">Entrou com o login errado? Clique <strong> aqui</strong> para voltar</a>
        </div>
    </body>
</html>
