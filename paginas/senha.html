<!DOCTYPE html>

<html lang="pt-br">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Recuperar Senha</title>
        <link rel="stylesheet" href="../css/style.css">
        <link rel="icon" href="https://img.icons8.com/?size=100&id=64144&format=png&color=000000" type="image/png">
        <script src="/javascript/recuperar-senha.js" defer></script>
    </head>

    <body>
        <div class="principal">
            <h1 class="titulo">Recuperar Senha</h1>
            <p class="aviso" id="aviso"></p>
            <p class="cpf-recuperar-senha">CPF</p>
            <input type="text" class="input-cpf" id="input-cpf" placeholder="000.000.000-00" maxlength="14" inputmode="numeric">
            <p class="email-recuperar-senha">Email</p>
            <input type="email" class="input-email" id="input-email">
            <button class="botao-recuperar" id="botao-recuperar">Recuperar</button>
        <a href="../index.html" class="botao-voltar">Tem sua senha? Clique <strong>aqui</strong> para retornar a página principal.</a>
        </div>
    </body>
</html>
