<!DOCTYPE html>

<html lang="pt-br">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Recuperar Senha</title>
        <link rel="stylesheet" href="../css/style.css">
        <link rel="icon" href="https://img.icons8.com/?size=100&id=64144&format=png&color=000000" type="image/png">
        <script src="../javascript/nova-senha.js" defer></script>
    </head>
    
    <body>
        <div class="principal">
            <h1 class="titulo" id="titulo">Recuperar Senha</h1>
            <p class="aviso" id="aviso"></p>
            <p class="senha-1" id="paragrafo-senha-1">Crie uma senha</p>
            <input type="text" class="input-senha-1" id="input-senha-1" maxlength="15">
            <p class="senha-2" id="paragrafo-senha-2">Repita a senha</p>
            <input type="password" class="input-senha-2" id="input-senha-2" maxlength="15">
            <button class="botao-alterar" id="botao-alterar">Alterar</button>
            <p class="senha-recuperada" id="senha-recuperada">Senha alterada com sucesso!</p>
            <a href="../index.html" class="botao-voltar" id="retornar">Clique <strong>aqui</strong> para retornar a página principal.</a>
        </div>
    </body>
</html>
